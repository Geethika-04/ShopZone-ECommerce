<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopZone | Checkout</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                🛒 ShopZone

            </a>

            <a class="btn btn-outline-light"
               href="cart.html">

                ← Back to Cart

            </a>

        </div>

    </nav>


    <!-- Checkout -->
    <section class="products-section">

        <div class="container">

            <h2 class="fw-bold mb-4">
                💳 Checkout
            </h2>


            <div class="row g-4">

                <!-- Customer Details -->
                <div class="col-md-7">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h4 class="mb-4">
                                Customer Details
                            </h4>


                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="customerName"
                                    class="form-control"
                                    placeholder="Enter your name">

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="customerEmail"
                                    class="form-control"
                                    placeholder="Enter your email">

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="customerPhone"
                                    class="form-control"
                                    placeholder="Enter phone number">

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Delivery Address
                                </label>

                                <textarea
                                    id="customerAddress"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter delivery address">
                                </textarea>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- Order Summary -->
                <div class="col-md-5">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h4 class="mb-4">
                                Order Summary
                            </h4>


                            <div id="checkoutItems">
                            </div>


                            <hr>


                            <div class="d-flex justify-content-between">

                                <strong>
                                    Total
                                </strong>

                                <strong id="checkoutTotal">
                                    ₹0
                                </strong>

                            </div>


                            <button
                                class="btn btn-success w-100 mt-4"
                                onclick="placeOrder()">

                                🛍️ Place Order

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script>

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];


        function displayCheckout() {

            const container =
                document.getElementById("checkoutItems");

            const totalElement =
                document.getElementById("checkoutTotal");


            if (cart.length === 0) {

                container.innerHTML = `

                    <div class="alert alert-warning">

                        Your cart is empty.

                    </div>

                `;

                totalElement.textContent = "₹0";

                return;
            }


            let total = 0;

            container.innerHTML = "";


            cart.forEach(product => {

                total += Number(product.price);

                container.innerHTML += `

                    <div class="d-flex
                                justify-content-between
                                mb-3">

                        <span>
                            ${product.name}
                        </span>

                        <strong>
                            ₹${product.price}
                        </strong>

                    </div>

                `;

            });


            totalElement.textContent =
                "₹" + total;
        }


        function placeOrder() {

            const name =
                document.getElementById("customerName").value.trim();

            const email =
                document.getElementById("customerEmail").value.trim();

            const phone =
                document.getElementById("customerPhone").value.trim();

            const address =
                document.getElementById("customerAddress").value.trim();


            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;
            }


            if (!name ||
                !email ||
                !phone ||
                !address) {

                alert("Please fill all customer details.");

                return;
            }


            alert(
                "Order placed successfully! 🎉"
            );


            // Clear cart
            localStorage.removeItem("cart");


            // Go back to home
            window.location.href =
                "index.html";
        }


        displayCheckout();

    </script>

</body>

</html>
